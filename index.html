    <script>
      // Polyfill/shim window.fetch with getter and setter to prevent Chrome extension TypeError
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if property is already defined
        }
      })();
    </script>
